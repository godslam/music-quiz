<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>YouTube Music Quiz</title>
    <style>
        :root {
            --bg-color: #121212;
            --card-color: #1e1e1e;
            --accent-color: #ff0055;
            --text-color: #ffffff;
        }
        body, html {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            background-color: var(--bg-color);
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            overflow: hidden;
        }
        /* The game board sits perfectly over the video player */
        .game-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: var(--bg-color);
            z-index: 10;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 20px;
            box-sizing: border-box;
            text-align: center;
        }
        .container {
            width: 100%;
            max-width: 400px;
            background: var(--card-color);
            padding: 30px;
            border-radius: 20px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
            box-sizing: border-box;
        }
        h1 { font-size: 1.8rem; margin: 0 0 20px 0; color: var(--accent-color); }
        input[type="text"] {
            width: 100%;
            padding: 12px;
            margin-bottom: 20px;
            border-radius: 10px;
            border: 2px solid #333;
            background: #2a2a2a;
            color: white;
            font-size: 1rem;
            box-sizing: border-box;
        }
        .slider-group {
            text-align: left;
            margin-bottom: 20px;
            background: #252525;
            padding: 15px;
            border-radius: 10px;
            border: 1px solid #333;
        }
        .slider-group label {
            display: flex;
            justify-content: space-between;
            font-size: 0.9rem;
            color: #ccc;
            margin-bottom: 8px;
        }
        .slider-group span { font-weight: bold; color: var(--accent-color); }
        input[type="range"] { width: 100%; accent-color: var(--accent-color); }
        button {
            width: 100%;
            padding: 15px;
            background: var(--accent-color);
            color: white;
            border: none;
            border-radius: 10px;
            font-size: 1.1rem;
            font-weight: bold;
            cursor: pointer;
            margin-bottom: 10px;
        }
        button:disabled { background: #444; }
        .game-ui { display: none; width: 100%; }
        .timer { font-size: 4rem; font-weight: bold; margin: 20px 0; color: #ffcc00; }
        .answer-box {
            background: #2a2a2a;
            padding: 15px;
            border-radius: 10px;
            margin-top: 20px;
            font-size: 1.2rem;
            font-weight: bold;
            display: none;
            border: 1px solid #444;
            word-wrap: break-word;
        }
        /* Keeps video rendering natively on screen underneath the layout */
        #yt-player {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 1;
        }
    </style>
</head>
<body>

    <div id="yt-player"></div>

    <div class="game-overlay">
        <div class="container">
            <h1>🎵 Song Guesser</h1>
            
            <div id="setup-ui">
                <input type="text" id="playlist-url" placeholder="Paste YouTube Link Here..." />
                
                <div class="slider-group">
                    <label>Start Position: <span id="start-val">30%</span></label>
                    <input type="range" id="start-percent" min="0" max="80" step="5" value="30" oninput="document.getElementById('start-val').innerText = this.value + '%'">
                </div>

                <div class="slider-group">
                    <label>Play Duration: <span id="duration-val">10s</span></label>
                    <input type="range" id="play-duration" min="2" max="30" step="1" value="10" oninput="document.getElementById('duration-val').innerText = this.value + 's'">
                </div>

                <button id="start-btn" onclick="initGame()">Load Game</button>
            </div>

            <div id="game-ui" class="game-ui">
                <div id="track-number" style="color: #aaa;">Preparing tracks...</div>
                <div class="timer" id="timer-display">--</div>
                
                <button id="play-clip-btn" onclick="playCurrentClip()" style="background: #2a9d8f;">▶️ Play Clip</button>
                <button id="action-btn" onclick="revealAnswer()" style="display: none;">Reveal Answer</button>
                <button id="next-btn" onclick="nextSong()" style="background: #00b4d8; display: none;">Next Song ➡️</button>
                
                <div class="answer-box" id="answer-box"></div>
            </div>
        </div>
    </div>

    <script>
        // Inject API asynchronously
        const tag = document.createElement('script');
        tag.src = "https://www.youtube.com/iframe_api";
        document.head.appendChild(tag);

        let player;
        let timerInterval;
        let timeLeft = 10;
        let configStartPercent = 0.30;
        let configPlayDuration = 10;
        let hasShuffled = false;

        function extractPlaylistId(url) {
            const reg = /[&?]list=([^#\&\?]+)/;
            const match = url.match(reg);
            return (match && match[1]) ? match[1] : null;
        }

        function initGame() {
            const urlInput = document.getElementById('playlist-url').value;
            const playlistId = extractPlaylistId(urlInput);

            if (!playlistId) {
                alert("Please pass a valid playlist link containing a list ID!");
                return;
            }

            configStartPercent = parseInt(document.getElementById('start-percent').value) / 100;
            configPlayDuration = parseInt(document.getElementById('play-duration').value);

            document.getElementById('start-btn').disabled = true;
            document.getElementById('start-btn').innerText = "Connecting...";

            // Initialize YouTube player frames natively inline
            player = new YT.Player('yt-player', {
                height: '100%',
                width: '100%',
                playerVars: {
                    listType: 'playlist',
                    list: playlistId,
                    autoplay: 0,
                    controls: 0,
                    playsinline: 1, // Crucial for mobile safari inline rendering
                    disablekb: 1
                },
                events: {
                    'onReady': onPlayerReady,
                    'onStateChange': onPlayerStateChange
                }
            });
        }

        function onPlayerReady(event) {
            document.getElementById('setup-ui').style.display = 'none';
            document.getElementById('game-ui').style.display = 'block';
            document.getElementById('timer-display').innerText = configPlayDuration;
            
            // Queue first array elements
            updateTrackInfo();
        }

        // Action step: Forced manual mobile tap to start music stream
        function playCurrentClip() {
            document.getElementById('play-clip-btn').disabled = true;
            document.getElementById('play-clip-btn').innerText = "Seeking...";
            
            if (!hasShuffled) {
                player.setShuffle(true);
                hasShuffled = true;
                // Give player a brief moment to randomize queue index
                setTimeout(() => { player.playVideo(); }, 400);
            } else {
                player.playVideo();
            }
        }

        function onPlayerStateChange(event) {
            if (event.data == YT.PlayerState.PLAYING) {
                const duration = player.getDuration();
                const currentPosition = player.getCurrentTime();
                const targetStartSec = Math.floor(duration * configStartPercent);

                // Run validation check to see if we need to skip deep into the song
                if (currentPosition < targetStartSec - 3 || currentPosition > targetStartSec + 3) {
                    player.seekTo(targetStartSec, true);
                } else {
                    // We are at our 30% mark. Update UI buttons and execute countdown clock
                    document.getElementById('play-clip-btn').style.display = 'none';
                    document.getElementById('action-btn').style.display = 'block';
                    updateTrackInfo();
                    startTimer();
                }
            }
        }

        function startTimer() {
            clearInterval(timerInterval);
            timeLeft = configPlayDuration;
            document.getElementById('timer-display').innerText = timeLeft;
            document.getElementById('timer-display').style.color = '#ffcc00';

            timerInterval = setInterval(() => {
                timeLeft--;
                document.getElementById('timer-display').innerText = timeLeft;

                if (timeLeft <= 3) document.getElementById('timer-display').style.color = '#ff0055';

                if (timeLeft <= 0) {
                    clearInterval(timerInterval);
                    revealAnswer();
                }
            }, 1000);
        }

        function updateTrackInfo() {
            const index = player.getPlaylistIndex() + 1 || 1;
            const list = player.getPlaylist();
            const total = list ? list.length : '??';
            document.getElementById('track-number').innerText = `Track ${index} of ${total}`;
        }

        function revealAnswer() {
            clearInterval(timerInterval);
            player.pauseVideo();

            const videoData = player.getVideoData();
            const title = videoData.title || "Unknown Title";
            const author = videoData.author || "Unknown Channel/Artist";

            const answerBox = document.getElementById('answer-box');
            answerBox.innerHTML = `🎵 ${title}<br><span style="font-size:0.9rem; color:#aaa;">Source: ${author}</span>`;
            answerBox.style.display = 'block';

            document.getElementById('action-btn').style.display = 'none';
            document.getElementById('next-btn').style.display = 'block';
        }

        function nextSong() {
            // Clean interface slate
            document.getElementById('answer-box').style.display = 'none';
            document.getElementById('next-btn').style.display = 'none';
            document.getElementById('play-clip-btn').style.display = 'block';
            document.getElementById('play-clip-btn').disabled = false;
            document.getElementById('play-clip-btn').innerText = "▶️ Play Clip";
            document.getElementById('track-number').innerText = "Loading next track...";
            document.getElementById('timer-display').innerText = configPlayDuration;
            document.getElementById('timer-display').style.color = '#ffcc00';

            player.nextVideo();
        }
    </script>
</body>
</html>
