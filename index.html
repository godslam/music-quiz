<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Music Quiz (Desktop Edition)</title>
    <style>
        :root {
            --bg-color: #121212;
            --card-color: #1e1e1e;
            --accent-color: #ff0055;
            --text-color: #ffffff;
        }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            margin: 0;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            box-sizing: border-box;
        }
        .container {
            width: 100%;
            max-width: 450px;
            background: var(--card-color);
            padding: 30px;
            border-radius: 20px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
            text-align: center;
        }
        h1 { font-size: 1.8rem; margin-bottom: 20px; color: var(--accent-color); }
        input[type="text"] {
            width: 100%;
            padding: 12px;
            margin-bottom: 20px;
            border-radius: 10px;
            border: 2px solid #333;
            background: #2a2a2a;
            color: white;
            font-size: 1rem;
            box-sizing: border-box;
        }
        .slider-group {
            text-align: left;
            margin-bottom: 20px;
            background: #252525;
            padding: 15px;
            border-radius: 10px;
            border: 1px solid #333;
        }
        .slider-group label {
            display: flex;
            justify-content: space-between;
            font-size: 0.9rem;
            color: #ccc;
            margin-bottom: 8px;
        }
        .slider-group span { font-weight: bold; color: var(--accent-color); }
        input[type="range"] { width: 100%; accent-color: var(--accent-color); }
        button {
            width: 100%;
            padding: 15px;
            background: var(--accent-color);
            color: white;
            border: none;
            border-radius: 10px;
            font-size: 1.1rem;
            font-weight: bold;
            cursor: pointer;
            margin-bottom: 10px;
        }
        button:disabled { background: #444; cursor: not-allowed; }
        .game-ui { display: none; margin-top: 20px; }
        .timer { font-size: 3.5rem; font-weight: bold; margin: 20px 0; color: #ffcc00; }
        .answer-box {
            background: #2a2a2a;
            padding: 15px;
            border-radius: 10px;
            margin-top: 20px;
            font-size: 1.2rem;
            font-weight: bold;
            display: none;
            border: 1px solid #444;
        }
        /* Completely hides the video box visually on desktop browsers */
        #player-container {
            position: absolute;
            visibility: hidden;
            width: 1px;
            height: 1px;
        }
    </style>
</head>
<body>

    <div class="container">
        <h1>🎵 Music Quiz</h1>
        
        <div id="setup-ui">
            <p style="margin-top:0;">Paste your YouTube Music Playlist URL:</p>
            <input type="text" id="playlist-url" placeholder="https://music.youtube.com/playlist?list=..." />
            
            <div class="slider-group">
                <label>Start Position: <span id="start-val">30%</span></label>
                <input type="range" id="start-percent" min="0" max="80" step="5" value="30" oninput="document.getElementById('start-val').innerText = this.value + '%'">
            </div>

            <div class="slider-group">
                <label>Play Duration: <span id="duration-val">10s</span></label>
                <input type="range" id="play-duration" min="2" max="30" step="1" value="10" oninput="document.getElementById('duration-val').innerText = this.value + 's'">
            </div>

            <button id="start-btn" onclick="initGame()">Start Game</button>
        </div>

        <div id="game-ui" class="game-ui">
            <div id="track-number" style="color: #aaa;">Loading playlist configuration...</div>
            <div class="timer" id="timer-display">--</div>
            
            <button id="action-btn" onclick="revealAnswer()">Reveal Answer</button>
            <button id="next-btn" onclick="nextSong()" style="background: #00b4d8; display: none;">Next Song ➡️</button>
            
            <div class="answer-box" id="answer-box"></div>
        </div>
    </div>

    <div id="player-container">
        <div id="yt-player"></div>
    </div>

    <script>
        // Load the API
        const tag = document.createElement('script');
        tag.src = "https://www.youtube.com/iframe_api";
        document.head.appendChild(tag);

        let player;
        let timerInterval;
        let timeLeft = 10;
        let isPlaylistLoaded = false;
        
        let configStartPercent = 0.30;
        let configPlayDuration = 10;

        function onYouTubeIframeAPIReady() {
            console.log("API Ready");
        }

        function extractPlaylistId(url) {
            // Updated regex pattern specifically allowed to trap negative symbols, hyphens, and underscores in standard/music IDs
            const reg = /[&?]list=([^#\&\?]+)/;
            const match = url.match(reg);
            return (match && match[1]) ? match[1] : null;
        }

        function initGame() {
            const urlInput = document.getElementById('playlist-url').value;
            const playlistId = extractPlaylistId(urlInput);

            if (!playlistId) {
                alert("Could not process playlist ID. Please verify the URL contains '?list='");
                return;
            }

            configStartPercent = parseInt(document.getElementById('start-percent').value) / 100;
            configPlayDuration = parseInt(document.getElementById('play-duration').value);

            document.getElementById('start-btn').disabled = true;
            document.getElementById('start-btn').innerText = "Shuffling Tracks...";

            player = new YT.Player('yt-player', {
                playerVars: {
                    listType: 'playlist',
                    list: playlistId,
                    autoplay: 0,
                    controls: 0,
                    disablekb: 1
                },
                events: {
                    'onReady': onPlayerReady,
                    'onStateChange': onPlayerStateChange
                }
            });
        }

        function onPlayerReady(event) {
            player.setShuffle(true);
            
            document.getElementById('setup-ui').style.display = 'none';
            document.getElementById('game-ui').style.display = 'block';
            
            // Desktop browsers allow immediate hand-off play commands safely
            setTimeout(() => {
                player.playVideoAt(0);
            }, 800);
        }

        function onPlayerStateChange(event) {
            if (event.data == YT.PlayerState.PLAYING) {
                if (!isPlaylistLoaded) {
                    isPlaylistLoaded = true;
                    player.setShuffle(true);
                }

                const duration = player.getDuration();
                const currentPosition = player.getCurrentTime();
                const targetStartSec = Math.floor(duration * configStartPercent);

                if (currentPosition < targetStartSec - 2 || currentPosition > targetStartSec + 2) {
                    player.seekTo(targetStartSec, true);
                    return; 
                }

                updateTrackInfo();
                startTimer();
            }
        }

        function startTimer() {
            clearInterval(timerInterval);
            timeLeft = configPlayDuration;
            document.getElementById('timer-display').innerText = timeLeft;
            document.getElementById('timer-display').style.color = '#ffcc00';

            timerInterval = setInterval(() => {
                timeLeft--;
                document.getElementById('timer-display').innerText = timeLeft;

                if (timeLeft <= 3) document.getElementById('timer-display').style.color = '#ff0055';

                if (timeLeft <= 0) {
                    clearInterval(timerInterval);
                    revealAnswer();
                }
            }, 1000);
        }

        function updateTrackInfo() {
            const index = player.getPlaylistIndex() + 1 || 1;
            const total = player.getPlaylist() ? player.getPlaylist().length : '??';
            document.getElementById('track-number').innerText = `Playing Song ${index} of ${total}`;
        }

        function revealAnswer() {
            clearInterval(timerInterval);
            player.pauseVideo();

            const videoData = player.getVideoData();
            const title = videoData.title || "Unknown Title";
            const author = videoData.author || "Unknown Artist";

            const answerBox = document.getElementById('answer-box');
            answerBox.innerHTML = `🎵 ${title}<br><span style="font-size:0.9rem; color:#aaa;">Artist/Channel: ${author}</span>`;
            answerBox.style.display = 'block';

            document.getElementById('action-btn').style.display = 'none';
            document.getElementById('next-btn').style.display = 'block';
        }

        function nextSong() {
            document.getElementById('answer-box').style.display = 'none';
            document.getElementById('next-btn').style.display = 'none';
            document.getElementById('action-btn').style.display = 'block';
            document.getElementById('track-number').innerText = "Loading next track...";
            document.getElementById('timer-display').innerText = configPlayDuration;
            document.getElementById('timer-display').style.color = '#ffcc00';

            player.nextVideo();
        }
    </script>
</body>
</html>
